[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medperf-server"
description = "Django REST API server for MedPerf"
readme = "README.md"
license = { file = "LICENSE.md" }
authors = [{ name = "MLCommons" }]
requires-python = "==3.11.*"
keywords = [
    "federated evaluation",
    "federated learning",
    "medical ai",
    "benchmarking",
    "healthcare",
    "medperf",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: System :: Distributed Computing",
]
dynamic = ["version", "dependencies", "optional-dependencies"]

[project.scripts]
medperf-server = "manage:main"

[project.urls]
Homepage = "https://github.com/mlcommons/medperf"
Repository = "https://github.com/mlcommons/medperf"
Issues = "https://github.com/mlcommons/medperf/issues"
Documentation = "https://docs.medperf.org"

[tool.setuptools]
py-modules = ["manage"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "medperf_server", "medperf_server.*",
    "aggregator", "aggregator.*",
    "aggregator_association", "aggregator_association.*",
    "asset", "asset.*",
    "benchmark", "benchmark.*",
    "benchmarkdataset", "benchmarkdataset.*",
    "benchmarkmodel", "benchmarkmodel.*",
    "ca", "ca.*",
    "ca_association", "ca_association.*",
    "certificate", "certificate.*",
    "dataset", "dataset.*",
    "encrypted_key", "encrypted_key.*",
    "mlcube", "mlcube.*",
    "model", "model.*",
    "result", "result.*",
    "traindataset_association", "traindataset_association.*",
    "training", "training.*",
    "trainingevent", "trainingevent.*",
    "user", "user.*",
    "utils", "utils.*",
]
exclude = [
    "benchmark.tests*",
    "benchmarkmodel.tests*",
    "certificate.tests*",
    "dataset.tests*",
    "encrypted_key.tests*",
    "mlcube.tests*",
    "model.tests*",
    "result.tests*",
    "user.tests*",
    "utils.tests*",
    "medperf_server.tests*",
    "medperf_server.testing_utils*",
]
namespaces = false

[tool.setuptools.dynamic]
version = { attr = "medperf_server._version.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.dynamic.optional-dependencies]
dev = { file = ["test-requirements.txt"] }
