name: FL Integration workflow

on: pull_request

jobs:
  setup:
    name: fl-integration-test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      working-directory: .
      run: |
        python -m pip install --upgrade pip
        pip install -e "./server[dev]"
        pip install -e "./cli[dev]"

    - name: Generate local mock login credentials
      working-directory: .
      run: python cli/generate_mock_credentials.py

    - name: Set server config and start postgresql
      run: medperf_server set_config postgresql

    - name: Run django server in background with generated certs
      working-directory: ./server
      run: |
        medperf_server start &
        timeout 120 bash -c 'until curl -ksf https://127.0.0.1:8000/version >/dev/null; do sleep 2; done'

    - name: Run server integration tests
      working-directory: ./server
      run: medperf_server seed --cert cert.crt

    # - name: Setup tmate session
    #   uses: mxschmitt/action-tmate@v3

    - name: Run client integration tests
      working-directory: .
      run: sh cli/cli_tests_training.sh -f