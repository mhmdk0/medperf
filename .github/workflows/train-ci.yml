name: FL Integration workflow

on: pull_request

jobs:
  setup:
    name: fl-integration-test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      working-directory: .
      run: |
        python -m pip install --upgrade pip
        pip install -r server/requirements.txt
        pip install -r server/test-requirements.txt
        pip install -e "./cli[dev]"

    - name: Generate local mock login credentials
      working-directory: .
      run: |
        python cli/generate_mock_credentials.py
        echo "AUTH_VERIFYING_KEY_FILE=$HOME/.medperf_dev/keys/public_key.pem" >> "$GITHUB_ENV"

    - name: Set server environment vars
      working-directory: ./server
      run: cp medperf_server/env_templates/.env.local.local-auth .env

    - name: Run postgresql server in background
      working-directory: ./server
      run: sh run_dev_postgresql.sh && sleep 6

    - name: Run django server in background with generated certs
      working-directory: ./server
      run: sh setup-dev-server.sh & sleep 6

    - name: Run server integration tests
      working-directory: ./server
      run: python seed.py --cert cert.crt

    # - name: Setup tmate session
    #   uses: mxschmitt/action-tmate@v3

    - name: Run client integration tests
      working-directory: .
      run: sh cli/cli_tests_training.sh -f