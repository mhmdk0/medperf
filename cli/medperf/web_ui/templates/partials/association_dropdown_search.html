<div class="sticky top-0 z-10 px-3 py-2 border-b border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-800 rounded-t-xl">
    <label class="sr-only">Filter list</label>
    <input
        type="search"
        x-model="listFilter"
        @click.stop
        @keydown.stop
        placeholder="{{ filter_placeholder | default('Filter by name or ID…', true) }}"
        autocomplete="off"
        class="w-full text-sm py-2 px-3 rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-green-500/30 focus:border-green-500"
    >
</div>
